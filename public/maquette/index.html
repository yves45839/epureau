<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow"><title>EPUREAU — Maquette de l’accueil</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;color:#1b2845;background:#e5e9ee}.review-bar{height:58px;background:white;border-bottom:1px solid #d4dbe5;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:0 24px}.review-title{font-weight:650;display:flex;align-items:center;gap:12px}.badge{font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;background:#ecf3f8;padding:5px 8px;border-radius:4px}.switcher{display:flex;padding:3px;border:1px solid #dce3eb;border-radius:8px;gap:3px}.switcher button{font:inherit;border:0;background:transparent;border-radius:5px;padding:7px 15px;color:#637086;cursor:pointer}.switcher button[aria-pressed=true]{color:white;background:#172b63}.review-link{font-size:13px;color:#43536d;text-decoration:none}.canvas{height:calc(100dvh - 58px);display:flex;justify-content:center;align-items:stretch;padding:0;transition:padding .35s}.canvas.mobile{padding:18px}.canvas iframe{background:white;border:0;width:100%;height:100%;transition:width .35s,border-radius .35s}.canvas.mobile iframe{width:390px;border-radius:24px;box-shadow:0 12px 50px #13244c22;border:6px solid #1b2435}.mobile .canvas-label{display:block}@media(max-width:650px){.review-bar{height:auto;min-height:58px;padding:10px 12px;gap:8px;flex-wrap:wrap}.review-title{font-size:12px}.badge,.review-link{display:none}.switcher button{padding:6px 10px;font-size:12px}.canvas.mobile{padding:8px}.canvas.mobile iframe{width:min(390px,100%);border-radius:16px}.canvas{height:calc(100dvh - 58px)}}
  </style>
</head>
<body>
  <header class="review-bar"><div class="review-title">EPUREAU <span class="badge">Maquette d’accueil</span></div><div class="switcher" aria-label="Format de la maquette"><button type="button" data-mode="desktop" aria-pressed="true">Ordinateur</button><button type="button" data-mode="mobile" aria-pressed="false">Mobile</button></div><a class="review-link" href="accueil.html?v=3" target="_blank" rel="noopener">Ouvrir en plein écran ↗</a></header>
  <div class="canvas"><iframe src="accueil.html?v=3" title="Maquette interactive de l’accueil EPUREAU"></iframe></div>
  <script>document.querySelectorAll('[data-mode]').forEach(button=>button.addEventListener('click',()=>{document.querySelector('.canvas').classList.toggle('mobile',button.dataset.mode==='mobile');document.querySelectorAll('[data-mode]').forEach(other=>other.setAttribute('aria-pressed',String(other===button)));}));</script>
</body>
</html>
